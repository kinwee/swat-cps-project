[project]
name = "swat-cps-project"
version = "1.0.0"
description = "SWaT CPS Attack & Defense — 51.508 Secure Cyber Physical Systems, SUTD"
requires-python = ">=3.9"
dependencies = [
    "pylogix>=1.1.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "Pillow>=10.0.0",
]

[project.scripts]
swat-demo = "run_demo:main"
